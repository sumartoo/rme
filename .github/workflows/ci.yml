# CI ClinicRME — setiap PR & push ke main (Stage 4, OD-025). Semua action dipin ke commit SHA
# (tag dapat dipindahkan penyerang — insiden trivy-action Maret 2026). Tanpa secret repository.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 19 * * 0'   # Minggu 02:17 WIB: uji mutasi mingguan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  PG_URL: postgres://postgres:postgres@localhost:5432 # pragma: allowlist secret — database CI sekali pakai

jobs:
  quality:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint memuat module boundaries, larangan pg langsung & sql.raw; unit memuat uji kontrak OpenAPI
      - run: pnpm nx run-many -t lint typecheck test build
      - name: Bundle hanya me-require paket yang ada di image produksi
        run: |
          pnpm --filter @clinicrme/api deploy --prod --legacy /tmp/img-api
          pnpm --filter @clinicrme/worker deploy --prod --legacy /tmp/img-worker
          node tools/check_bundle_deps.mjs /tmp/img-api apps/api/dist/main.js apps/api/dist/migrate.js
          node tools/check_bundle_deps.mjs /tmp/img-worker apps/worker/dist/main.js
      - name: Lint kontrak OpenAPI
        run: npx --yes @redocly/cli@2.73.0 lint api/openapi.yaml

  integration:
    name: integrasi · SQL · skema · worker · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret — database CI sekali pakai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres # pragma: allowlist secret
      MIGRATION_DATABASE_URL_BASE: postgres://postgres:postgres@localhost:5432 # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Klien PostgreSQL 16 (pg_dump harus sama versi dengan server)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Uji integrasi API (suite Stage 3 + fondasi + konkurensi)
        run: pnpm test:integration
      - name: Uji keamanan skema SQL (DB dari migrasi)
        run: pnpm test:db
      - name: Migrasi baseline ≡ db/schema (ADR-0009)
        run: pnpm check:schema
      - name: Chromium untuk Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Worker self-test (pg-boss + partisi audit)
        run: |
          psql "$PG_URL/postgres" -c "CREATE DATABASE crme_worker_ci"
          MIGRATION_DATABASE_URL="$PG_URL/crme_worker_ci" pnpm db:migrate
          pnpm nx run @clinicrme/worker:build
          WORKER_DATABASE_URL="$PG_URL/crme_worker_ci" ENCRYPTION_KEY_HEX="$(openssl rand -hex 32)" WORKER_SELFTEST=1 APP_ENV=test node apps/worker/dist/main.js
      - name: E2E konsol platform & aplikasi klinik (Playwright, Chromium)
        run: pnpm test:e2e
      - name: Simpan trace Playwright bila gagal
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-trace
          path: |
            apps/platform-admin/test-results/
            apps/web/test-results/
          retention-days: 7

  # Uji mutasi (RSK-020): ±60 menit karena setiap login ulang di uji menunggu periode TOTP baru (anti-replay, RSK-024).
  # ±60 menit: hanya mingguan (cron) atau manual sebelum gate stage — tidak per PR/push agar deploy-dev
  # (menunggu seluruh workflow ci selesai) tidak tertahan satu jam setiap merge.
  mutation:
    name: uji mutasi M1–M31
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret — database CI sekali pakai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium untuk Playwright (mutasi UI M10)
        run: pnpm exec playwright install --with-deps chromium
      - name: Uji mutasi (setiap kontrol yang dirusak harus membuat uji gagal)
        run: MUTATION_E2E=1 pnpm test:mutation

  compose:
    name: stack lokal (pnpm dev tanpa watch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sama dengan `pnpm dev` (README), tetapi aplikasi dijalankan dari hasil build agar langkah bisa diperiksa
      - run: pnpm dev:setup
      - run: pnpm nx run @clinicrme/api:build
      # Perawat: role tanpa MFA (dokter wajib MFA sejak migrasi 0008, DEC-019) — /me langsung dapat diperiksa
      - name: API → readyz, login demo, /me, password salah, tenant tak dikenal
        run: |
          set -a; . ./.env; set +a
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:3000/readyz && break; sleep 1; done
          H="Host: demo.localhost:3000"
          printf '{"email":"perawat@demo.test","password":"%s"}' "$DEV_SEED_PASSWORD" > /tmp/login.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cj -H "$H" -H 'content-type: application/json' --data @/tmp/login.json localhost:3000/api/v1/auth/login)" = 200
          curl -sf -b /tmp/cj -H "$H" localhost:3000/api/v1/me | grep -q perawat@demo.test
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -H 'content-type: application/json' -d '{"email":"perawat@demo.test","password":"salah"}' localhost:3000/api/v1/auth/login)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: lain.localhost:3000' localhost:3000/api/v1/me)" = 404
          if grep -q "$DEV_SEED_PASSWORD" /tmp/api.log; then echo "password muncul di log"; exit 1; fi
      - if: always()
        run: docker compose down -v

  vps-stack:
    name: stack VPS dev (deploy.sh + Caddy TLS internal)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLINICRME_ROOT: /tmp/clinicrme
      CLINICRME_APP: ${{ github.workspace }}
      DEPLOY_SKIP_GIT: '1'
      COMPOSE_EXTRA: /tmp/clinicrme/ci-override.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Sama dengan bootstrap.sh bagian .env (secret acak), domain uji clinic.test; sertifikat dari CA internal Caddy
      - name: Siapkan .env & override CI
        run: |
          mkdir -p "$CLINICRME_ROOT"
          r() { openssl rand -hex 16; }
          { echo BASE_DOMAIN=clinic.test; echo ACME_EMAIL=ops@example.test; echo POSTGRES_DB=clinicrme
            echo POSTGRES_OWNER_USER=clinicrme_owner; echo "POSTGRES_OWNER_PASSWORD=$(r)"
            echo POSTGRES_API_USER=clinicrme_api; echo "POSTGRES_API_PASSWORD=$(r)"
            echo POSTGRES_PLATFORM_USER=clinicrme_platform_api; echo "POSTGRES_PLATFORM_PASSWORD=$(r)"
            echo "ENCRYPTION_KEY_HEX=$(openssl rand -hex 32)"; echo "DEV_SEED_PASSWORD=$(r)"; } > "$CLINICRME_ROOT/.env"
          sed 's/^\t\ton_demand$/\t\ton_demand\n\t\tissuer internal/' deploy/vps/Caddyfile > "$CLINICRME_ROOT/Caddyfile"
          grep -q 'issuer internal' "$CLINICRME_ROOT/Caddyfile"
          printf 'services:\n  caddy:\n    volumes: !override [%s/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]\n' "$CLINICRME_ROOT" > "$COMPOSE_EXTRA"
      - name: deploy.sh --seed (deploy pertama)
        run: bash deploy/vps/deploy.sh "$GITHUB_SHA" --seed
      - name: deploy.sh ulang (idempoten, tanpa seed)
        run: bash deploy/vps/deploy.sh "$GITHUB_SHA"
      - name: Cek lewat Caddy — health, login demo, /me, endpoint internal tertutup, subdomain asing tanpa sertifikat
        run: |
          set -a; . "$CLINICRME_ROOT/.env"; set +a
          R=(--resolve admin.clinic.test:443:127.0.0.1 --resolve demo.clinic.test:443:127.0.0.1 --resolve asing.clinic.test:443:127.0.0.1)
          c() { curl -sk "${R[@]}" -o /dev/null -w '%{http_code}' "$@"; }
          test "$(c https://admin.clinic.test/healthz)" = 200
          test "$(c https://demo.clinic.test/healthz)" = 200
          printf '{"email":"perawat@demo.test","password":"%s"}' "$DEV_SEED_PASSWORD" > /tmp/login.json
          test "$(c -c /tmp/cj -H 'content-type: application/json' --data @/tmp/login.json https://demo.clinic.test/api/v1/auth/login)" = 200
          sed 's/^#HttpOnly_//' /tmp/cj | awk '!/^#/ && NF>=7 && $4=="TRUE"' | grep -q .   # cookie sesi ber-flag Secure
          curl -sfk "${R[@]}" -b /tmp/cj https://demo.clinic.test/api/v1/me | grep -q perawat@demo.test
          test "$(c 'https://demo.clinic.test/internal/tls-allowed?domain=demo.clinic.test')" = 404
          curl -sI "${R[@]}" https://demo.clinic.test/healthz -k | grep -qi strict-transport-security
          if curl -sk "${R[@]}" -o /dev/null https://asing.clinic.test/healthz; then echo "subdomain asing dapat sertifikat"; exit 1; fi
          if docker compose -f deploy/vps/docker-compose.yml -f "$COMPOSE_EXTRA" --env-file "$CLINICRME_ROOT/.env" ps --format '{{.Ports}}' | grep -E '0\.0\.0\.0:(5432|3000|8025)'; then echo "port internal terbuka"; exit 1; fi
      # Mode PROXY=nginx (VPS yang sudah punya nginx untuk situs lain): Caddy tidak jalan, web/konsol hanya di loopback
      - name: Mode nginx — deploy.sh + nginx-install.sh, cek lewat nginx host
        run: |
          docker compose -f deploy/vps/docker-compose.yml -f "$COMPOSE_EXTRA" --env-file "$CLINICRME_ROOT/.env" --profile caddy rm -sf caddy
          printf 'PROXY=nginx\nWEB_PORT=18080\nADMIN_PORT=18081\n' >> "$CLINICRME_ROOT/.env"
          bash deploy/vps/deploy.sh "$GITHUB_SHA"
          if docker ps --format '{{.Names}}' | grep -q caddy; then echo "caddy masih jalan"; exit 1; fi
          docker ps --format '{{.Ports}}' | grep -q '127.0.0.1:18080->3000'
          if docker ps --format '{{.Ports}}' | grep -E '0\.0\.0\.0:(18080|18081|5432|3000|8025)'; then echo "port internal terbuka"; exit 1; fi
          sudo apt-get install -y -q nginx >/dev/null
          sudo CLINICRME_ROOT="$CLINICRME_ROOT" bash deploy/vps/nginx-install.sh clinic.test klinik-b
          h() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1$2"; }
          test "$(h admin.clinic.test /healthz)" = 200
          test "$(h demo.clinic.test /healthz)" = 200
          test "$(h demo.clinic.test /internal/tls-allowed)" = 404
          grep -q 'server_name demo.clinic.test klinik-b.clinic.test;' /etc/nginx/sites-available/clinicrme
      - if: failure()
        run: docker compose -f deploy/vps/docker-compose.yml -f "$COMPOSE_EXTRA" --env-file "$CLINICRME_ROOT/.env" logs --no-color --tail 200
      - if: always()
        run: docker compose -f deploy/vps/docker-compose.yml -f "$COMPOSE_EXTRA" --env-file "$CLINICRME_ROOT/.env" down -v

  images:
    name: image Docker (build · jalan · scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build api, worker, web
        run: |
          docker build -f docker/node-app.Dockerfile --build-arg APP=api -t clinicrme-api:ci .
          docker build -f docker/node-app.Dockerfile --build-arg APP=worker -t clinicrme-worker:ci .
          docker build -f docker/web.Dockerfile -t clinicrme-web:ci .
          docker build -f docker/web.Dockerfile --build-arg APP=platform-admin -t clinicrme-platform-admin:ci .
      - name: Jalankan image (migrasi → API readyz → web healthz → worker self-test)
        env:
          IMG_DATABASE_URL: postgres://crme_img_api:img@localhost:5432/crme_img # pragma: allowlist secret — role uji sekali pakai
          IMG_PLATFORM_DATABASE_URL: postgres://crme_img_platform:img@localhost:5432/crme_img # pragma: allowlist secret — role uji sekali pakai
        run: |
          psql "$PG_URL/postgres" -c "CREATE DATABASE crme_img" -c "CREATE ROLE crme_img_api LOGIN PASSWORD 'img'" -c "CREATE ROLE crme_img_platform LOGIN PASSWORD 'img'" # pragma: allowlist secret
          docker run --rm --network host -e MIGRATION_DATABASE_URL="$PG_URL/crme_img" -e MIGRATIONS_DIR=/app/db/migrations clinicrme-api:ci migrate.js
          psql "$PG_URL/crme_img" -c "GRANT clinicrme_app TO crme_img_api" -c "GRANT clinicrme_platform TO crme_img_platform"
          docker run -d --name api --network host -e APP_ENV=dev -e PORT=3300 \
            -e DATABASE_URL="$IMG_DATABASE_URL" -e PLATFORM_DATABASE_URL="$IMG_PLATFORM_DATABASE_URL" -e STORAGE_DRIVER=gcs -e ENCRYPTION_KEY_HEX="$(openssl rand -hex 32)" \
            -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=x -e GOOGLE_REDIRECT_URI=https://x.invalid/cb clinicrme-api:ci
          docker run -d --name web -p 3301:3000 clinicrme-web:ci
          docker run -d --name padmin -p 3302:3000 clinicrme-platform-admin:ci
          for _ in $(seq 1 30); do curl -sf localhost:3300/readyz && curl -sf localhost:3301/healthz && curl -sf localhost:3302/healthz && break; sleep 1; done
          curl -sf localhost:3300/readyz && curl -sf localhost:3301/healthz && curl -sf localhost:3302/healthz
          docker run --rm --network host -e WORKER_DATABASE_URL="$PG_URL/crme_img" -e ENCRYPTION_KEY_HEX="$(openssl rand -hex 32)" -e WORKER_SELFTEST=1 -e APP_ENV=test clinicrme-worker:ci
          test "$(docker inspect -f '{{.Config.User}}' clinicrme-api:ci)" = nonroot
      - name: Scan kerentanan image (osv-scanner; informasi — gerbang dependency aplikasi ada di workflow security)
        run: |
          curl -sSLo osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          for img in api worker web platform-admin; do docker save clinicrme-$img:ci -o /tmp/$img.tar; ./osv-scanner scan image --archive /tmp/$img.tar --format table || echo "::warning::temuan di image $img (lihat log)"; done
