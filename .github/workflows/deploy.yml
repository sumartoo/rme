# Deploy otomatis ke VPS DEV (CR-0003) setelah workflow `ci` hijau di main. Tanpa action pihak ketiga:
# hanya ssh bawaan runner. Build image dilakukan di VPS (tanpa registry). Data SINTETIS saja.
# Secret repository (diisi PO, Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (kunci privat khusus deploy), VPS_KNOWN_HOSTS (ssh-keyscan VPS)
# Variable repository: DEPLOY_VPS_ENABLED=true — selama belum di-set, workflow dilewati (tidak gagal).
name: deploy-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Jalankan seed data demo sintetis (idempoten)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_VPS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev
    steps:
      - name: Siapkan kunci SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SEED: ${{ inputs.seed && '--seed' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" \
            "cd /opt/clinicrme/app && git fetch --quiet --depth 50 origin main && git checkout --quiet --force $SHA && bash deploy/vps/deploy.sh $SHA $SEED"
      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/id_deploy
