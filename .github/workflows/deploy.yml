# Deploy otomatis ke VPS DEV (CR-0003) setelah workflow `ci` hijau di main. Tanpa action pihak ketiga selain
# checkout: kode dikirim lewat SSH sebagai arsip `git archive` → VPS tidak menyimpan kredensial repo (deploy key
# dinonaktifkan kebijakan organisasi AtoAIs). Rilis di /home/deploy/apps/clinicrme/releases/<sha>, `app` = symlink rilis aktif,
# 3 rilis terakhir disimpan. Image dibuild di runner lalu dikirim lewat SSH (tanpa registry, hemat disk VPS). Data SINTETIS saja.
# Environment GitHub `production` (Settings → Environments; nama mengikuti pengaturan PO — isinya tetap VPS DEV):
#   secret   DEPLOY_VPS_ENABLED=true, VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (kunci privat khusus deploy),
#            VPS_KNOWN_HOSTS (baris `IP_VPS ssh-ed25519 …`)            (boleh juga di level repository)
# DEPLOY_VPS_ENABLED/VPS_HOST/VPS_USER dibaca dari secret lebih dulu; variable dengan nama sama tetap diterima sebagai
# cadangan (masa peralihan). Nilai secret tersamar (***) di log. Selama DEPLOY_VPS_ENABLED belum `true`, deploy dilewati.
name: deploy-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Jalankan seed data demo sintetis (idempoten)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Secret/variable environment baru terbaca setelah job masuk environment → saklar DEPLOY_VPS_ENABLED dicek di langkah pertama
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ENABLED: ${{ secrets.DEPLOY_VPS_ENABLED || vars.DEPLOY_VPS_ENABLED }}
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER }}
    steps:
      - name: Cek saklar & konfigurasi
        id: gate
        env:
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_KNOWN_HOSTS != '' }}
        run: |
          if [ "$ENABLED" != true ]; then echo "::notice::DEPLOY_VPS_ENABLED belum true — deploy dilewati"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ "$HAS_KEY" = true ] || missing="$missing VPS_SSH_KEY/VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then echo "::error::belum diisi:$missing"; exit 1; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Siapkan kunci SSH
        if: steps.gate.outputs.go == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Secret yang ditempel dari Windows bisa membawa CR (\r) → kunci ditolak
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::VPS_SSH_KEY bukan kunci privat OpenSSH yang valid (salin lengkap dari BEGIN sampai END)"; exit 1; }
          echo "Sidik jari kunci: $(ssh-keygen -lf ~/.ssh/id_deploy | awk '{print $2}')"
      # Build di runner GitHub (disk & CPU lega), VPS hanya menerima image jadi (docker save | ssh docker load)
      - name: Build image rilis
        if: steps.gate.outputs.go == 'true'
        run: |
          printf 'POSTGRES_OWNER_PASSWORD=build-only\nBASE_DOMAIN=build.invalid\n' > /tmp/build.env  # pragma: allowlist secret — hanya untuk interpolasi compose saat build
          RELEASE="$SHA" docker compose -f deploy/vps/docker-compose.yml --env-file /tmp/build.env build api worker web platform-admin
          docker image ls 'clinicrme-*'
      - name: Kirim image ke VPS
        if: steps.gate.outputs.go == 'true'
        run: |
          docker save "clinicrme-api:$SHA" "clinicrme-worker:$SHA" "clinicrme-web:$SHA" "clinicrme-platform-admin:$SHA" \
            | gzip -1 | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "gunzip | docker load"
      - name: Kirim kode rilis ke VPS
        if: steps.gate.outputs.go == 'true'
        run: |
          git archive --format=tar "$SHA" | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -e; d=/home/deploy/apps/clinicrme/releases/$SHA; rm -rf \"\$d.tmp\"; mkdir -p \"\$d.tmp\"; tar -x -C \"\$d.tmp\"; rm -rf \"\$d\"; mv \"\$d.tmp\" \"\$d\""
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        env:
          SEED: ${{ inputs.seed && '--seed' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" \
            "set -e; cd /home/deploy/apps/clinicrme; if [ -d app ] && [ ! -L app ]; then mv app app.old-$(date +%s); fi; ln -sfn releases/$SHA app; DEPLOY_SKIP_GIT=1 bash app/deploy/vps/deploy.sh $SHA $SEED; ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf"
      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/id_deploy
