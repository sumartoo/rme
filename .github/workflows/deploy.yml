# Deploy otomatis ke VPS DEV (CR-0003) setelah workflow `ci` hijau di main. Tanpa action pihak ketiga selain
# checkout: kode dikirim lewat SSH sebagai arsip `git archive` → VPS tidak menyimpan kredensial repo (deploy key
# dinonaktifkan kebijakan organisasi AtoAIs). Rilis di /home/deploy/apps/clinicrme/releases/<sha>, `app` = symlink rilis aktif,
# 3 rilis terakhir disimpan. Build image dilakukan di VPS (tanpa registry). Data SINTETIS saja.
# Secret repository (diisi PO, Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (kunci privat khusus deploy), VPS_KNOWN_HOSTS (ssh-keyscan VPS)
# Variable repository: DEPLOY_VPS_ENABLED=true — selama belum di-set, workflow dilewati (tidak gagal).
name: deploy-dev

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Jalankan seed data demo sintetis (idempoten)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_VPS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Siapkan kunci SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Kirim kode rilis ke VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          git archive --format=tar "$SHA" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "set -e; d=/home/deploy/apps/clinicrme/releases/$SHA; rm -rf \"\$d.tmp\"; mkdir -p \"\$d.tmp\"; tar -x -C \"\$d.tmp\"; rm -rf \"\$d\"; mv \"\$d.tmp\" \"\$d\""
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SEED: ${{ inputs.seed && '--seed' || '' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" \
            "set -e; cd /home/deploy/apps/clinicrme; if [ -d app ] && [ ! -L app ]; then mv app app.old-$(date +%s); fi; ln -sfn releases/$SHA app; DEPLOY_SKIP_GIT=1 bash app/deploy/vps/deploy.sh $SHA $SEED; ls -1dt releases/*/ | tail -n +4 | xargs -r rm -rf"
      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/id_deploy
