openapi: 3.1.0
info:
  title: ClinicRME API
  version: 0.1.0-draft
  description: Draft kontrak API Stage 2 (design-first, ADR-0008). Setiap operasi memuat `x-requirements` (ID SRS) dan `x-permission`. Semua endpoint
    `/api/v1` beroperasi dalam konteks tenant & cabang aktif dari sesi; tenant tidak pernah dikirim di body.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://{tenant}.clinicrme.id
  variables:
    tenant:
      default: demo
- url: https://staging.clinicrme.id
security:
- session: []
tags:
- name: Auth
  description: Auth
- name: IAM
  description: IAM
- name: Audit
  description: Audit
- name: Platform
  description: Platform
- name: Tenant
  description: Tenant
- name: Master
  description: Master
- name: Terminology
  description: Terminology
- name: Patient
  description: Patient
- name: Clinical
  description: Clinical
- name: Document
  description: Document
- name: Scheduling
  description: Scheduling
- name: Pharmacy
  description: Pharmacy
- name: Billing
  description: Billing
- name: Integration
  description: Integration
- name: Report
  description: Report
paths:
  /api/v1/auth/google:
    get:
      operationId: authGoogleStart
      tags:
      - Auth
      summary: Mulai login Google (redirect 302)
      x-requirements:
      - IAM-FR-002
      security: []
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/google/callback:
    get:
      operationId: authGoogleCallback
      tags:
      - Auth
      summary: Callback OAuth Google; buat sesi
      x-requirements:
      - IAM-FR-002
      security: []
      responses:
        '302':
          description: Redirect
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      operationId: authPasswordLogin
      tags:
      - Auth
      summary: Login email & password
      x-requirements:
      - IAM-FR-003
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/password-reset:
    post:
      operationId: authPasswordResetRequest
      tags:
      - Auth
      summary: Minta tautan reset password (respons selalu sama)
      x-requirements:
      - IAM-FR-004
      - NTF-FR-001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '202':
          description: Diterima untuk diproses
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      tags:
      - Auth
      summary: Set password baru dengan token
      x-requirements:
      - IAM-FR-004
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
              required:
              - token
              - password
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/verify:
    post:
      operationId: authMfaVerify
      tags:
      - Auth
      summary: Verifikasi TOTP untuk sesi
      x-requirements:
      - IAM-FR-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/enroll:
    post:
      operationId: authMfaEnroll
      tags:
      - Auth
      summary: Mulai pendaftaran TOTP (secret + recovery codes)
      x-requirements:
      - IAM-FR-005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUrl:
                    type: string
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags:
      - Auth
      summary: Akhiri sesi
      x-requirements:
      - AUD-FR-001
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/invitations/{token}:
    get:
      operationId: invitationGet
      tags:
      - Auth
      summary: Detail undangan (sebelum login)
      x-requirements:
      - IAM-FR-001
      parameters:
      - $ref: '#/components/parameters/token'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/invitations/{token}/accept:
    post:
      operationId: invitationAccept
      tags:
      - Auth
      summary: Terima undangan dengan membuat password (OD-078)
      x-requirements:
      - IAM-FR-001
      - IAM-FR-003
      parameters:
      - $ref: '#/components/parameters/token'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: &id001
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/session:
    get:
      operationId: authSession
      tags:
      - Auth
      summary: 'Status sesi (boleh sebelum MFA): langkah MFA berikutnya, tanpa permission'
      x-requirements:
      - IAM-FR-005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me:
    get:
      operationId: meGet
      tags:
      - IAM
      summary: Profil, tenant, cabang aktif, permission
      x-requirements:
      - IAM-FR-009
      - IAM-FR-010
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/branch:
    post:
      operationId: meSelectBranch
      tags:
      - IAM
      summary: Pilih cabang aktif
      x-requirements:
      - IAM-FR-009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchSelect'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchSelect'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/me/menu:
    get:
      operationId: meMenu
      tags:
      - IAM
      summary: Menu sesuai permission efektif
      x-requirements:
      - IAM-FR-010
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/sessions:
    get:
      operationId: meSessions
      tags:
      - IAM
      summary: Daftar sesi aktif
      x-requirements:
      - IAM-FR-013
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/sessions/{sessionId}:
    delete:
      operationId: meRevokeSession
      tags:
      - IAM
      summary: Cabut sesi
      x-requirements:
      - IAM-FR-013
      parameters:
      - $ref: '#/components/parameters/sessionId'
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users:
    get:
      operationId: userList
      tags:
      - IAM
      summary: Daftar user
      x-requirements:
      - IAM-FR-001
      x-permission: iam.user.read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                required:
                - data
                - page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/invitations:
    get:
      operationId: userInvitationList
      tags:
      - IAM
      summary: Undangan aktif yang belum diterima
      x-requirements:
      - IAM-FR-001
      x-permission: iam.user.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: userInvite
      tags:
      - IAM
      summary: Undang user (cek kuota paket)
      x-requirements:
      - IAM-FR-001
      - IAM-FR-016
      - PLT-FR-004
      - NTF-FR-001
      x-permission: iam.user.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/disable:
    post:
      operationId: userDisable
      tags:
      - IAM
      summary: Nonaktifkan user & cabut semua sesi
      x-requirements:
      - IAM-FR-014
      x-permission: iam.user.manage
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/practitioner:
    post:
      operationId: userLinkPractitioner
      tags:
      - IAM
      summary: Tautkan/lepas tenaga kesehatan (dasar tanda tangan klinis)
      x-requirements:
      - IAM-FR-016
      x-permission: iam.user.manage
      parameters:
      - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                practitionerId:
                  type:
                  - string
                  - 'null'
                  format: uuid
              required:
              - practitionerId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: &id002
                    type: string
                    format: uuid
                  practitionerId:
                    type:
                    - string
                    - 'null'
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/enable:
    post:
      operationId: userEnable
      tags:
      - IAM
      summary: Aktifkan kembali user (kuota paket berlaku)
      x-requirements:
      - IAM-FR-014
      - PLT-FR-004
      x-permission: iam.user.manage
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}/mfa:
    delete:
      operationId: userResetMfa
      tags:
      - IAM
      summary: Reset MFA user (authenticator hilang); semua sesi dicabut
      x-requirements:
      - IAM-FR-005
      - IAM-FR-013
      x-permission: iam.user.manage
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{userId}/sessions:
    delete:
      operationId: userRevokeAllSessions
      tags:
      - IAM
      summary: Cabut seluruh sesi user
      x-requirements:
      - IAM-FR-013
      x-permission: iam.user.manage
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/roles:
    get:
      operationId: roleList
      tags:
      - IAM
      summary: Daftar role
      x-requirements:
      - IAM-FR-007
      x-permission: iam.role.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: roleCreate
      tags:
      - IAM
      summary: Buat role custom
      x-requirements:
      - IAM-FR-008
      x-permission: iam.role.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpsert'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/roles/{roleId}:
    put:
      operationId: roleUpdate
      tags:
      - IAM
      summary: Ubah role & permission
      x-requirements:
      - IAM-FR-008
      x-permission: iam.role.manage
      parameters:
      - $ref: '#/components/parameters/roleId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /api/v1/permissions:
    get:
      operationId: permissionList
      tags:
      - IAM
      summary: Katalog permission
      x-requirements:
      - IAM-FR-008
      - IAM-FR-011
      x-permission: iam.role.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    module:
                      type: string
                    description:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit-logs:
    get:
      operationId: auditSearch
      tags:
      - Audit
      summary: Cari audit (user, pasien, aksi, periode)
      x-requirements:
      - AUD-FR-001
      - AUD-FR-002
      - AUD-FR-004
      x-permission: audit.log.read
      parameters:
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                required:
                - data
                - page
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/platform/v1/auth/login:
    post:
      operationId: platformAuthLogin
      tags:
      - Platform
      summary: Login konsol platform (email & password; TOTP wajib sesudahnya)
      x-requirements:
      - PLT-FR-001
      - IAM-FR-005
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaEnrolled: *id001
                required:
                - mfaEnrolled
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/platform/v1/auth/mfa/enroll:
    post:
      operationId: platformAuthMfaEnroll
      tags:
      - Platform
      summary: Daftarkan TOTP (hanya bila belum terdaftar)
      x-requirements:
      - IAM-FR-005
      security:
      - platformSession: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUrl:
                    type: string
                  recoveryCodes:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/platform/v1/auth/mfa/verify:
    post:
      operationId: platformAuthMfaVerify
      tags:
      - Platform
      summary: Verifikasi TOTP; sesi dirotasi
      x-requirements:
      - IAM-FR-005
      security:
      - platformSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
      responses:
        '204':
          description: Berhasil
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/platform/v1/auth/logout:
    post:
      operationId: platformAuthLogout
      tags:
      - Platform
      summary: Akhiri sesi konsol
      x-requirements:
      - AUD-FR-001
      security:
      - platformSession: []
      responses:
        '204':
