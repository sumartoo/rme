      tags:
      - Report
      summary: Umur piutang
      x-requirements:
      - RPT-FR-007
      x-permission: report.finance.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/anomalies:
    get:
      operationId: reportAnomalies
      tags:
      - Report
      summary: Transaksi tidak wajar
      x-requirements:
      - BIL-FR-016
      x-permission: report.finance.audit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/reports/{reportCode}/exports:
    post:
      operationId: reportExport
      tags:
      - Report
      summary: Export Excel/CSV/PDF (watermark, asinkron)
      x-requirements:
      - RPT-FR-008
      x-permission: report.export
      parameters:
      - $ref: '#/components/parameters/reportCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
