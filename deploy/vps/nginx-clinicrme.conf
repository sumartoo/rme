# ClinicRME DEV di belakang nginx host (PROXY=nginx, CR-0003). Salin ke /etc/nginx/sites-available/clinicrme,
# ganti BASE_DOMAIN (mis. medika.atoai.id) & port bila diubah, lalu:
#   sudo ln -s /etc/nginx/sites-available/clinicrme /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.BASE_DOMAIN -d demo.BASE_DOMAIN      # klinik baru: tambahkan -d <kode>.BASE_DOMAIN --expand
# Tenant ditentukan dari Host → Host asli WAJIB diteruskan. Header keamanan (CSP, no-store) diatur aplikasi.

map $http_upgrade $clinicrme_conn { default upgrade; '' close; }

server {
    listen 80;
    server_name admin.BASE_DOMAIN;
    location /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:ADMIN_PORT;
        include /etc/nginx/clinicrme-proxy.inc;
    }
}

server {
    listen 80;
    server_name CLINIC_NAMES;
    location /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:WEB_PORT;
        include /etc/nginx/clinicrme-proxy.inc;
    }
}
